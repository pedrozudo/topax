[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "topax"
version = "0.0.2"
description = "topax: a topology optimization library written in Jax."
authors = [
    { name = "Pedro Zuidberg Dos Martires" }
]
dependencies = [
    "einops>=0.8.0",
    "flax>=0.10.0",
    "jax>=0.11.1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
